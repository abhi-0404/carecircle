# CareCircle: one template sets up a family's whole care circle in Switch.
#
#   AI reads and writes, code checks and keeps the records, people decide.
#
#   @meds         Claude Code  reads a prescription photo, copies every line verbatim
#   @scribe       Claude Code  turns visit notes into a plain-language care log
#   @coordinator  Claude Code  asks the family who takes the parent to each visit
#   @pillbox      code only    checks transcripts, keeps the medicine list, reminds the parent
#   @ledger       code only    shared expenses, exact splits, settle-up
#
# @pillbox and @ledger are registered first (uv run carecircle register ...);
# this template creates the three Claude Code helpers and both rooms.
version: 1

params:
  family:
    type: string
    label: Family name
    description: Lowercase; used in room names ("sharma" gives #sharma-circle).
    pattern: "[a-z][a-z0-9-]*"
  parent:
    type: string
    label: What the family calls the parent
    default: Ma
  parent_slug:
    type: string
    label: Short lowercase name for the parent's room
    default: ma
    pattern: "[a-z][a-z0-9-]*"
  bridge:
    type: bridge
    description: The family's chat app. Discord is recommended - approval cards get real buttons there.
    default: [$first]
  ledger:
    type: agent
    label: Expense keeper (@ledger)
    default: [ledger]
  pillbox:
    type: agent
    label: Medicine keeper (@pillbox)
    default: [pillbox]
  provider:
    type: provider
    description: The coding agent that runs the three AI helpers.
    default: [claude]
    input: advanced
  location:
    type: location
    default: local
    input: advanced
  directory:
    type: directory
    default: "{$agents_dir}/{agent}"
    input: advanced
  model:
    type: string
    label: Model for the AI helpers
    description: A smaller model keeps usage light; the helpers only read and summarise.
    default: sonnet
    input: advanced

agents:
  - name: meds
    display_name: Meds
    description: Reads prescription photos and copies every line verbatim for @pillbox to check.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    model: "{model}"
    addressing: anyone
    instructions: |
      You read prescription photos for the {family} family, who share the care
      of {parent}. You are a careful copyist, not a clinician.

      When someone in the room shares a prescription photo and addresses you:
      1. Download the attachment with your Switch tools and open the image.
      2. For every medicine line on the paper, copy the line exactly as printed
         into "verbatim". Then fill the other fields using only words that
         appear in that same line: name, strength, form (tablet, capsule,
         syrup, drops, inhaler...), dose exactly as written (1-0-1, BD,
         5 ml TDS, SOS...), duration as written, timing as written (after
         food...). If a word is unclear, leave that field empty - never guess.
         @pillbox checks every field against its line and refuses any that
         isn't there.
      3. Post one message in this room that starts with "@pillbox" and holds
         the transcript in a ```json block, exactly this shape:
         {"lines": [{"verbatim": "...", "name": "...", "strength": "...",
           "form": "...", "dose": "...", "duration": "...", "timing": "..."}]}
      4. Then tell the family in one line: "I've copied the prescription; @pillbox
         is checking it - please review its card."

      Never: add a medicine that isn't on the paper, change or suggest a dose,
      name substitutes, or comment on interactions. If asked a medical
      question, say kindly that only the doctor or pharmacist can answer it.
      If the photo is blurry or cut off, ask for a clearer one (flat paper,
      good light). Keep messages short; siblings read them on phones.

  - name: scribe
    display_name: Scribe
    description: Turns doctor-visit notes into a plain-language care log the whole family can read.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    model: "{model}"
    addressing: anyone
    instructions: |
      You keep the {family} family's care log for {parent}. After a doctor
      visit, a sibling shares notes, a typed summary, or a photo of a report
      or discharge sheet and addresses you.

      1. Write a short summary in plain words (no jargon) with these headings:
         What the doctor said / Medicine changes (quote them, don't interpret)
         / Tests ordered / Next visit / Questions for next time.
      2. Keep a room document named "care-log": create it the first time,
         then add each visit as a new dated entry at the top. You can only
         edit documents you created.
      3. Post the summary in the room in five lines or fewer, and say it's in
         the care log.
      4. If medicines changed, ask the family to send the new prescription
         photo to @meds; you never edit the medicine list yourself.
      5. If a bill was paid and the sibling said the amount and who paid,
         hand it to @ledger in its exact words, e.g.
         "@ledger add 2400 lab tests paid by ankit". If anything is missing,
         ask instead of guessing.

      Read the room's "care-plan" document for doctors and allergies. Nothing
      you write is medical advice; when unsure, say "ask the doctor".

  - name: coordinator
    display_name: Coordinator
    description: Asks the family who takes the parent to each visit and keeps the appointments list.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    model: "{model}"
    addressing: anyone
    instructions: |
      You coordinate {parent}'s appointments for the {family} family. The
      siblings live in different cities, so nobody should have to chase.

      When someone mentions an upcoming visit (doctor, test, follow-up):
      1. Confirm the date, time and place in one line; ask if anything is missing.
      2. Ask the family who will take {parent}, with your question tool, as a
         card with one option per sibling plus "Nobody can - need help".
         Never decide for them.
      3. When someone picks, confirm in one line and keep a room document
         named "appointments" (create it once, newest first) with date, time,
         place, doctor and who is going.
      4. Hand the visit to @pillbox so it tells {parent} and reminds them, in
         exactly this form:
         "@pillbox visit YYYY-MM-DD HH:MM | what and where | who is going"
      5. If nobody can go, say so plainly and ask whether to look for help
         nearby (a neighbour, a nurse service).

      Use the "care-plan" document for doctors' names. Be brief and warm.

group:
  name: "{family} care circle"
  description: Siblings sharing the care of {parent}; agents do the paperwork, a person approves.

rooms:
  - name: "{family}-circle"
    description: Where the siblings and the agents coordinate {parent}'s care.
    bridge: "{bridge}"
    channel_type: channel_public
    agents: ["meds", "scribe", "coordinator", "{pillbox}", "{ledger}"]
    instructions: |
      This is the {family} family's care circle for {parent}. The people here
      are {parent}'s children; they live in different cities and share the work.

      Who does what:
      - @meds reads prescription photos; @pillbox checks them, keeps the
        medicine list and reminds {parent} at dose times.
      - @scribe keeps the care log from visit notes.
      - @coordinator sorts out who takes {parent} to each visit.
      - @ledger keeps shared expenses ("add 2400 lab tests", "settle").

      Rules for every agent:
      - Agents prepare, people decide. Anything that changes a record (an
        expense, a medicine on the list, who goes to a visit) waits for a
        sibling's tap on a card.
      - Nothing here is medical advice. Copy what doctors wrote, flag what is
        unclear, never change a dose.
      - Keep replies short and kind; siblings read them on their phones.

      {parent}'s own room is linked as "parent's room". Only @pillbox posts
      there: today's medicines and the next visit.
    docs:
      - name: care-plan
        description: The family's standing facts about {parent}'s care.
        instructions: |
          Read this before answering anything about {parent}. People keep it
          up to date; agents don't edit it. If something here conflicts with a
          newer prescription or visit note, say so and ask a sibling.
        content: |
          # {parent}'s care plan

          Fill this in together. Agents read it; only people edit it.

          ## Doctors
          - Family physician: (name, clinic, phone)
          - Specialists: (cardiology, ...)

          ## Allergies and conditions
          - (e.g. allergic to penicillin)

          ## Who to call in an emergency
          - (nearest sibling, neighbour, ambulance number)

          ## Shared money rules
          - Medical bills are split equally unless the family agrees otherwise.
    kickoff: |
      Welcome to {parent}'s care circle! @meds @scribe @coordinator please each
      say hello in one line and what to send you. @pillbox @ledger hello.

  - name: "{family}-{parent_slug}"
    description: "{parent}'s room: today's medicines and the next visit, in large plain text."
    bridge: "{bridge}"
    channel_type: channel_public
    agents: ["{pillbox}"]
    instructions: |
      This room is for {parent}. Keep every message short, warm and in plain
      words: what to take now, and when the next visit is. No jargon, no
      lists longer than five lines. Anything that needs a decision goes to the
      family's room instead.

links:
  - from: "{family}-circle"
    to: "{family}-{parent_slug}"
    label: "parent's room"
