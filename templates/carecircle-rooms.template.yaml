# CareCircle rooms: one template sets up a family's care circle in Switch.
#
#   #<family>-circle      the siblings + the agents; where the work happens
#   #<family>-<parent>    a calm room for the parent: today's medicines and visits
#
# The two rooms are linked, so agents in the family room know the parent's
# room exists (a link grants no access). The family's care plan is a room
# document every agent reads when it joins. @ledger, the expense keeper, is an
# agent you register first (see the README); the AI helpers come from
# carecircle.template.yaml once you've chosen how they reach Claude.
version: 1

params:
  family:
    type: string
    label: Family name
    description: Lowercase; used in room names ("sharma" gives #sharma-circle).
    pattern: "[a-z][a-z0-9-]*"
  parent:
    type: string
    label: What the family calls the parent
    default: Ma
  parent_slug:
    type: string
    label: Short lowercase name for the parent's room
    default: ma
    pattern: "[a-z][a-z0-9-]*"
  bridge:
    type: bridge
    description: The family's chat app. Discord is recommended - approval cards get real buttons there.
    default: [$first]
  ledger:
    type: agent
    label: Expense keeper
    description: The @ledger agent you registered (uv run carecircle register ledger).
    default: [ledger]
  pillbox:
    type: agent
    label: Medicine keeper
    description: The @pillbox agent you registered (uv run carecircle register pillbox).
    default: [pillbox]

group:
  name: "{family} care circle"
  description: Siblings sharing the care of {parent}; agents do the paperwork, a person approves.

rooms:
  - name: "{family}-circle"
    description: Where the siblings and the agents coordinate {parent}'s care.
    bridge: "{bridge}"
    channel_type: channel_public
    agents: ["{ledger}", "{pillbox}"]
    instructions: |
      This is the {family} family's care circle for {parent}. The people here
      are {parent}'s children; they live in different cities and share the work.

      How this room works:
      - Agents prepare, people decide. Anything that changes a record (an
        expense, a medicine on {parent}'s list, who goes to an appointment)
        waits for a sibling to tap Approve on a card.
      - Money: address @{ledger}. It never guesses; it uses a fixed grammar
        ("add 2400 lab tests", "settle") and plain code does every sum.
      - Health: nothing in this room is medical advice. Agents copy what
        doctors wrote and flag what's unclear; they never change a dose.
      - Keep replies short and kind. Siblings read this on their phones.

      The parent's own room is linked as "parent's room". Post there only
      what {parent} needs to see: today's medicines and the next visit.
    docs:
      - name: care-plan
        description: The family's standing facts about {parent}'s care.
        instructions: |
          Read this before answering anything about {parent}. People keep it
          up to date; agents don't edit it. If something here conflicts with a
          newer prescription or visit note, say so and ask a sibling.
        content: |
          # {parent}'s care plan

          Fill this in together. Agents read it; only people edit it.

          ## Doctors
          - Family physician: (name, clinic, phone)
          - Specialists: (cardiology, ...)

          ## Allergies and conditions
          - (e.g. allergic to penicillin)

          ## Who to call in an emergency
          - (nearest sibling, neighbour, ambulance number)

          ## Shared money rules
          - Medical bills are split equally unless the family agrees otherwise.
    kickoff: |
      @{ledger} hello - show the family how to record an expense.

  - name: "{family}-{parent_slug}"
    description: "{parent}'s room: today's medicines and the next visit, in large plain text."
    bridge: "{bridge}"
    channel_type: channel_public
    agents: ["{pillbox}"]
    instructions: |
      This room is for {parent}. Keep every message short, warm and in plain
      words: what to take now, and when the next visit is. No jargon, no
      lists longer than five lines. Anything that needs a decision goes to the
      family's room instead.

links:
  - from: "{family}-circle"
    to: "{family}-{parent_slug}"
    label: "parent's room"
