name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Tests
        run: uv run pytest -q
      - name: Offline demo (the whole story, no Switch or keys)
        run: uv run carecircle demo
        env:
          PYTHONIOENCODING: utf-8
