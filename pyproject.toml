[project]
name = "carecircle"
version = "0.1.0"
description = "Siblings share the care of an aging parent in one Switch room: agents do the paperwork, a sibling taps to approve."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[project.scripts]
carecircle = "carecircle.service:main"
carecircle-ledger = "carecircle.ledger_agent:main"

[dependency-groups]
dev = ["pytest>=8"]
demo = ["pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carecircle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
